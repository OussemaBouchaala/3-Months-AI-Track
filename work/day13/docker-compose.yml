# Two services on one Compose network. Run with: docker compose up --build
services:
  api:
    build: .
    ports:
      - "8002:8002"
    environment:
      # TODO: OLLAMA_URL pointing at the ollama SERVICE NAME (not localhost), port 11434
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    # TODO: image ollama/ollama, and a named volume mounted at /root/.ollama so models survive restarts
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
# TODO: declare the named volume here (top-level `volumes:`)
volumes:
    ollama: